name: Deploy Container to AWS
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: npm ci && npm run test:unit # 1. Quality Gate

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag & Push Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/astro-blog:$IMAGE_TAG .
        docker push $ECR_REGISTRY/astro-blog:$IMAGE_TAG
        
        echo "image=$ECR_REGISTRY/astro-blog:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      # use echo to store image name for task-def step

    # https://github.com/aws-actions/amazon-ecs-render-task-definition
    - name: Create Amazon ECS Task
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: aws-task-definition.json
        container-name: astro-blog
        image: ${{ steps.build-image.outputs.image }}
